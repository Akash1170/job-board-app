<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container">

<h2>Login</h2>

<form id="loginForm">

<input
class="form-control mb-3"
type="email"
id="email"
placeholder="Email"
required>

<input
class="form-control mb-3"
type="password"
id="password"
placeholder="Password"
required>

<button class="btn btn-success">
Login
</button>

</form>

<p id="message"></p>

</div>

<script src="js/login.js"></script>

</body>
</html>
